<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英语打卡 · 宠物图鉴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #e8f6f1;
      --bg2: #fff4e8;
      --ink: #2a3a36;
      --muted: #5c6f68;
      --accent: #e07a5f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #c8ebe0 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 90% 10%, #ffd9c2 0%, transparent 50%),
        linear-gradient(165deg, var(--bg1), var(--bg2));
    }
    header {
      padding: 2.5rem 1.5rem 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: "ZCOOL KuaiLe", "Nunito", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 400;
    }
    header p {
      margin: 0.6rem auto 0;
      max-width: 28rem;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
      padding: 1.5rem clamp(1rem, 4vw, 3rem) 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    article {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 1.25rem;
      padding: 1rem 1rem 1.25rem;
      backdrop-filter: blur(6px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    article:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(42, 58, 54, 0.12);
    }
    article img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 0.9rem;
      display: block;
      background: #fff;
    }
    article h2 {
      margin: 0.85rem 0 0.2rem;
      font-size: 1.15rem;
      font-weight: 800;
    }
    article .en {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }
    article .tag {
      margin: 0.55rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>英语打卡 · 宠物图鉴</h1>
    <p>中华田园犬、紫蛇、粉兔、小鸡仔、白猫、仓鼠 —— 打卡攒 XP，一起升级。</p>
  </header>
  <section class="grid" id="roster" aria-label="宠物名单"></section>
  <script>
    const pets = [
      { img: "pet-chinese-dog.jpg", zh: "大黄", en: "Huang · 中华田园犬", tag: "村里最勤快的打卡搭子，竖起耳朵就来学英语！" },
      { img: "pet-purple-snake.jpg", zh: "紫紫", en: "Violet · 词汇小蛇", tag: "把生词一圈圈缠牢，就不会溜走啦。" },
      { img: "pet-pink-bunny.jpg", zh: "桃桃", en: "Peach · 口语粉兔", tag: "粉粉耳朵竖起来，开口练习不怕羞。" },
      { img: "pet-chick.jpg", zh: "叽叽", en: "Chirp · 听力小鸡", tag: "小小耳朵竖起来，英语一点一点听进心。" },
      { img: "pet-white-kitten.jpg", zh: "雪团", en: "Snow · 语法白猫", tag: "把句子揉得软软的，再慢慢排整齐。" },
      { img: "pet-hamster.jpg", zh: "豆豆", en: "Nibble · 记忆仓鼠", tag: "把单词塞进腮帮子，慢慢嚼、慢慢记。" }
    ];
    document.getElementById("roster").innerHTML = pets.map((p) => `
      <article>
        <img src="${p.img}" alt="${p.zh}" loading="lazy" />
        <h2>${p.zh}</h2>
        <div class="en">${p.en}</div>
        <p class="tag">${p.tag}</p>
      </article>
    `).join("");
  </script>
</body>
</html>
