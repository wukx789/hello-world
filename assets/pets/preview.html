<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英语打卡 · 宠物五阶段</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #e8f6f1;
      --bg2: #fff4e8;
      --ink: #2a3a36;
      --muted: #5c6f68;
      --accent: #e07a5f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #c8ebe0 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 90% 10%, #ffd9c2 0%, transparent 50%),
        linear-gradient(165deg, var(--bg1), var(--bg2));
    }
    header {
      padding: 2.5rem 1.5rem 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: "ZCOOL KuaiLe", "Nunito", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 400;
    }
    header p {
      margin: 0.6rem auto 0;
      max-width: 32rem;
      color: var(--muted);
    }
    .pet {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding: 0 clamp(1rem, 4vw, 3rem);
    }
    .pet h2 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
      font-weight: 800;
    }
    .pet .en {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.85rem;
    }
    .stages {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.65rem;
      align-items: start;
    }
    @media (max-width: 800px) {
      .stages { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 480px) {
      .stages { grid-template-columns: repeat(2, 1fr); }
    }
    figure {
      margin: 0;
      text-align: center;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 1rem;
      padding: 0.55rem;
      backdrop-filter: blur(4px);
    }
    figure img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 0.75rem;
      background: #fff;
      display: block;
    }
    figcaption {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>英语打卡 · 五阶段成长</h1>
    <p>蛋 → 破壳 → 幼体 → 少年 → 成年。打卡攒 XP，宠物一步步长大。</p>
  </header>
  <div id="root"></div>
  <script>
    const labels = ["蛋", "破壳", "幼体", "少年", "成年"];
    const pets = [
      { zh: "大黄", en: "Huang · 中华田园犬", base: "pet-chinese-dog" },
      { zh: "紫紫", en: "Violet · 词汇小蛇", base: "pet-purple-snake" },
      { zh: "桃桃", en: "Peach · 口语粉兔", base: "pet-pink-bunny" },
      { zh: "叽叽", en: "Chirp · 听力小鸡", base: "pet-chick" },
      { zh: "雪团", en: "Snow · 语法白猫", base: "pet-white-kitten" },
      { zh: "豆豆", en: "Nibble · 记忆仓鼠", base: "pet-hamster" }
    ];
    const suffixes = ["s1-egg", "s2-hatch", "s3-grow", "s4-teen", "s5-adult"];
    document.getElementById("root").innerHTML = pets.map((p) => `
      <section class="pet">
        <h2>${p.zh}</h2>
        <div class="en">${p.en}</div>
        <div class="stages">
          ${suffixes.map((s, i) => `
            <figure>
              <img src="${p.base}-${s}.jpg" alt="${p.zh} ${labels[i]}" loading="lazy" />
              <figcaption>Lv.${i + 1} ${labels[i]}</figcaption>
            </figure>
          `).join("")}
        </div>
      </section>
    `).join("");
  </script>
</body>
</html>
