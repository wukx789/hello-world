<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英语打卡 · 宠物图鉴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #e8f6f1;
      --bg2: #fff4e8;
      --ink: #2a3a36;
      --muted: #5c6f68;
      --accent: #e07a5f;
      --card-gap: 1.25rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #c8ebe0 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 90% 10%, #ffd9c2 0%, transparent 50%),
        linear-gradient(165deg, var(--bg1), var(--bg2));
    }
    header {
      padding: 2.5rem 1.5rem 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: "ZCOOL KuaiLe", "Nunito", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0.6rem auto 0;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--card-gap);
      padding: 1.5rem clamp(1rem, 4vw, 3rem) 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    article {
      background: rgba(255, 255, 255, 0.55);
      border-radius: 1.25rem;
      padding: 1rem 1rem 1.25rem;
      backdrop-filter: blur(6px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    article:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(42, 58, 54, 0.12);
    }
    article img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 0.9rem;
      display: block;
      background: #fff;
    }
    article h2 {
      margin: 0.85rem 0 0.2rem;
      font-size: 1.15rem;
      font-weight: 800;
    }
    article .en {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
    }
    article .tag {
      margin: 0.55rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .stages {
      margin-top: 2rem;
      padding: 0 clamp(1rem, 4vw, 3rem) 3rem;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
    .stages h2 {
      font-family: "ZCOOL KuaiLe", "Nunito", sans-serif;
      font-weight: 400;
      font-size: 1.5rem;
    }
    .stage-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 700px) {
      .stage-row { grid-template-columns: 1fr; }
    }
    .stage-row figure {
      margin: 0;
      text-align: center;
    }
    .stage-row img {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 1rem;
      background: #fff;
    }
    .stage-row figcaption {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>英语打卡 · 宠物图鉴</h1>
    <p>六只陪伴打卡的小伙伴。打卡攒 XP，宠物会升级变装。</p>
  </header>

  <section class="grid" id="roster" aria-label="宠物名单"></section>

  <section class="stages">
    <h2>升级示例 · 小焰 Ember</h2>
    <div class="stage-row">
      <figure>
        <img src="pet-ember-fox.jpg" alt="小焰 幼狐" />
        <figcaption>Lv.1 幼狐</figcaption>
      </figure>
      <figure>
        <img src="pet-ember-fox-stage2.jpg" alt="小焰 学徒狐" />
        <figcaption>Lv.2 学徒狐</figcaption>
      </figure>
      <figure>
        <img src="pet-ember-fox-stage3.jpg" alt="小焰 星焰狐" />
        <figcaption>Lv.3 星焰狐</figcaption>
      </figure>
    </div>

    <h2 style="margin-top:2rem">升级示例 · 麻糬 Mochi</h2>
    <div class="stage-row">
      <figure>
        <img src="pet-mochi-cat.jpg" alt="麻糬 团子猫" />
        <figcaption>Lv.1 团子猫</figcaption>
      </figure>
      <figure>
        <img src="pet-mochi-cat-stage2.jpg" alt="麻糬 眼镜猫" />
        <figcaption>Lv.2 眼镜猫</figcaption>
      </figure>
      <figure>
        <img src="pet-mochi-cat-stage3.jpg" alt="麻糬 叶冠猫" />
        <figcaption>Lv.3 叶冠猫</figcaption>
      </figure>
    </div>
  </section>

  <script>
    const pets = [
      { img: "pet-ember-fox.jpg", zh: "小焰", en: "Ember · 单词狐", tag: "记一个词，尾巴就多一分暖意。" },
      { img: "pet-mochi-cat.jpg", zh: "麻糬", en: "Mochi · 语法猫", tag: "把句子揉得软软的，再慢慢排整齐。" },
      { img: "pet-pip-sparrow.jpg", zh: "吱吱", en: "Pip · 听力雀", tag: "小声听世界，大声记英语。" },
      { img: "pet-bun-rabbit.jpg", zh: "团团", en: "Bun · 口语兔", tag: "开口不怕羞，耳朵帮你记节奏。" },
      { img: "pet-pebble-penguin.jpg", zh: "鹅卵", en: "Pebble · 打卡企鹅", tag: "今天也来报到啦，一步一步不掉队。" },
      { img: "pet-coco-bear.jpg", zh: "可可", en: "Coco · 记忆熊", tag: "忘了也没关系，我帮你抱抱再记一次。" }
    ];
    const root = document.getElementById("roster");
    root.innerHTML = pets.map((p) => `
      <article>
        <img src="${p.img}" alt="${p.zh}" loading="lazy" />
        <h2>${p.zh}</h2>
        <div class="en">${p.en}</div>
        <p class="tag">${p.tag}</p>
      </article>
    `).join("");
  </script>
</body>
</html>
